title: realSergiy
description: Stories, cheatsheets, and tech notes
author: realSergiy
url: "https://realsergiy.github.io"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  stories:
    output: true
    permalink: /stories/:path:output_ext
  cheet:
    output: true
    permalink: /cheet/:path:output_ext
  tech:
    output: true
    permalink: /tech/:path:output_ext

defaults:
  - scope:
      type: stories
    values:
      layout: story
      author: realSergiy
  - scope:
      type: cheet
    values:
      layout: story
      author: realSergiy
  - scope:
      type: tech
    values:
      layout: story
      author: realSergiy

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  collections:
    - stories
    - cheet
    - tech

exclude:
  - excludes
  - docs
  - gists
  - gists_37132
  - settings
  - README.md
  - .rumdl.toml
  - justfile
