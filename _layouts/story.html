<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html css="story.css" %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
  {% include nav.html %}
  <main class="article">
    {% if page.title %}
    <header class="article-header grid-glow">
      <h1>{{ page.title }}</h1>
      <p class="article-meta">
        {{ page.author }}{% if page.date %} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
      </p>
    </header>
    {% endif %}
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
